[package]
name = "lazyfetch"
version = "0.4.3"
edition = "2024"
description = "fastfetch-based program written in rust with #![no_std]"
license = "MIT"
authors = ["maslina524 <luk.kirill2804@gmail.com>"]
repository = "https://github.com/maslina524/lazyfetch"
categories = ["no-std", "command-line-utilities"]
keywords = [
    "cli", "no-std", "embedded", "fetch", "no-dependencies"
]

[[bin]]
name = "lazyfetch"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# debug = true
panic = "abort"
strip = "symbols"

[profile.dev]
opt-level = 0
lto = false
debug = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[dependencies]
# Local crate, ONLY for macro-attr: #[todo("...")]
todo = { path = "./todo", version = "0.0.0" }

# Local crate, creates help documentation for the module,
# has dependencies (unfortunately cannot be without them)
doc = { path = "./doc", version = "0.0.0" }

[build-dependencies]
chrono = "0.4.45"
zlib-rs = "0.6.7"
rayon = "1.12.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
serde = { version = "1", features = ["derive"] }
quote = "1"
proc-macro2 = "1"
syn = "3.0.5"
termimad = "0.35.4"
winresource = "0.1.31"

[workspace]
members = ["todo", "doc"]
resolver = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
        'cfg(lua5_5)', 'cfg(lua5_4)',
        'cfg(glibc)', 'cfg(bionic)',
    ] 
}
