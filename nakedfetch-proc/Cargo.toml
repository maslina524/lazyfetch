[package]
name = "proc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
quote = "1.0.47"
syn = { version = "3.0.5", features = ["full", "derive"] }
proc-macro2 = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
        'cfg(unstable)'
    ]
}