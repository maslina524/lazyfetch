name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: nakedfetch.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: nakedfetch
          - os: ubuntu-latest
            target: aarch64-linux-android
            binary: nakedfetch

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: ${{ matrix.target }}
          components: rust-src

      - name: Install Lua dev (Linux GNU)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y liblua5.4-dev

      - name: Install Android NDK env
        if: contains(matrix.target, 'android')
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT}}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME}}" >> $GITHUB_ENV

      - name: Install cargo-ndk (Android)
        if: contains(matrix.target, 'android')
        run: cargo install cargo-ndk --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build (desktop)
        if: "!contains(matrix.target, 'android')"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (Android arm64)
        if: contains(matrix.target, 'android')
        env:
          ANDROID_PLATFORM: "24"
        run: cargo ndk -t arm64-v8a --platform 24 build --release

      - name: Rename binary
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv "${{ matrix.binary }}" "nakedfetch-${{ matrix.target }}.exe"
          else
            mv "${{ matrix.binary }}" "nakedfetch-${{ matrix.target }}"
          fi

      - name: Generate SHA-256 hash
        shell: bash
        if: "!contains(matrix.target, 'android')"
        run: |
          cd target/${{ matrix.target }}/release/
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN="nakedfetch-${{ matrix.target }}.exe"
          else
            BIN="nakedfetch-${{ matrix.target }}"
          fi
          ./$BIN --version hash > "sha256-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nakedfetch-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/nakedfetch-${{ matrix.target }}*
            target/${{ matrix.target }}/release/sha256-${{ matrix.target }}

  release:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}