[package]
name = "nakedfetch"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
proc = { path = "../nakedfetch-proc" }

[build-dependencies]
chrono      = "0.4.45"
zlib-rs     = "0.6.7"
serde_json  = "1.0.151"
serde       = { version = "1", features = ["derive"] }
quote       = "1.0.47"
proc-macro2 = "1"
syn         = "3.0.5"
winresource = "0.1.31"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
        'cfg(lua5_5)', 'cfg(lua5_4)',
        'cfg(glibc)', 'cfg(bionic)',
    ]
}
